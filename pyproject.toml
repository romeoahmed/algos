[project]
name = "algos"
version = "0.1.0"
requires-python = ">=3.14"

[dependency-groups]
dev = ["hypothesis>=6.170.15", "pytest>=9.2.0", "ruff>=0.17.4", "ty>=0.0.100"]

[tool.uv]
package = false

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RET", "RUF", "ANN", "PT", "PTH"]

[tool.ty.rules]
all = "error"
